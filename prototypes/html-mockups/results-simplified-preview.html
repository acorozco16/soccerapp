<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplified Results Preview</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #004996 0%, #003875 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            padding-top: 50px;
        }
        .close-button {
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }
        .header-section {
            text-align: center;
            padding: 0 20px;
            margin-bottom: 40px;
        }
        .checkmark-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .session-complete-text {
            color: #FCBF00;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-left: 8px;
        }
        .great-session-text {
            color: #FCBF00;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .drill-name-text {
            color: white;
            font-size: 24px;
            font-weight: 500;
        }
        .main-metric-container {
            padding: 0 20px;
            margin-bottom: 40px;
        }
        .touch-count-card {
            background: #333;
            border-radius: 20px;
            border: 3px solid #FCBF00;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .touch-count-number {
            color: white;
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1;
        }
        .touch-count-label {
            color: #FCBF00;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .metrics-container {
            padding: 0 20px;
            margin-bottom: 40px;
            flex: 1;
        }
        .metric-card {
            background: #333;
            border-radius: 15px;
            padding: 20px 25px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metric-label {
            color: #6C757D;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .metric-value {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        .metric-value-gold {
            color: #FCBF00;
            font-size: 18px;
            font-weight: bold;
        }
        .button-container {
            padding: 0 20px 30px;
        }
        .try-again-button {
            background: #004996;
            border: 2px solid white;
            border-radius: 25px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }
        .try-again-button-text {
            color: white;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .checkmark {
            color: #FCBF00;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="close-button">✕</div>
        </div>

        <div class="header-section">
            <div class="checkmark-container">
                <div class="checkmark">✓</div>
                <div class="session-complete-text">SESSION COMPLETE</div>
            </div>
            <div class="great-session-text">GREAT SESSION!</div>
            <div class="drill-name-text">Juggling</div>
        </div>

        <div class="main-metric-container">
            <div class="touch-count-card">
                <div class="touch-count-number">26</div>
                <div class="touch-count-label">TOUCHES</div>
            </div>
        </div>

        <div class="metrics-container">
            <div class="metric-card">
                <div class="metric-label">DURATION</div>
                <div class="metric-value">45 seconds</div>
            </div>

            <div class="metric-card">
                <div class="metric-label">TOUCHES PER MINUTE</div>
                <div class="metric-value-gold">34.7</div>
            </div>

            <div class="metric-card">
                <div class="metric-label">AVERAGE INTERVAL</div>
                <div class="metric-value">1.7 sec</div>
            </div>
        </div>

        <div class="button-container">
            <div class="try-again-button">
                <div class="try-again-button-text">TRY AGAIN</div>
            </div>
        </div>
    </div>
</body>
</html>
