<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeScreen Preview</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F8F9FA;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #F8F9FA;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #004996;
        }
        .logout-text {
            color: #6C757D;
            font-size: 16px;
            cursor: pointer;
        }
        .card {
            background: #FFFFFF;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #004996;
            margin-bottom: 8px;
        }
        .card-description {
            font-size: 16px;
            color: #6C757D;
            margin-bottom: 16px;
        }
        .button {
            background-color: #FCBF00;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }
        .button-text {
            color: #004996;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Welcome Back! ⚽</div>
            <div class="logout-text">Logout</div>
        </div>

        <div class="card">
            <div class="card-title">Start Training</div>
            <div class="card-description">
                Choose a drill and record your practice session
            </div>
            <div class="button">
                <div class="button-text">Select Drill</div>
            </div>
        </div>
    </div>
</body>
</html>
