<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill Progress - Soccer Training App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #F8F9FA;
            color: #333;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            background: #F8F9FA;
        }
        
        /* Header */
        .header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .back-arrow {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .header-title {
            font-size: 20px;
            font-weight: 600;
            color: #004996;
        }
        
        .placeholder {
            width: 34px;
        }
        
        /* Content */
        .content {
            padding: 20px;
        }
        
        /* Hero Stats */
        .hero-stats {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #004996;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #6C757D;
            margin-bottom: 8px;
        }
        
        .stat-change {
            font-size: 14px;
            font-weight: 600;
            color: #28a745;
        }
        
        .stat-change.negative {
            color: #dc3545;
        }
        
        /* Personal Best Card */
        .personal-best {
            background: linear-gradient(135deg, #FCBF00, #FFA500);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            color: white;
        }
        
        .best-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .best-label {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            opacity: 0.9;
        }
        
        .best-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .best-date {
            font-size: 14px;
            opacity: 0.8;
        }
        
        /* 7 Day Chart */
        .chart-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: #004996;
            margin-bottom: 20px;
        }
        
        .chart-container {
            height: 120px;
            display: flex;
            align-items: end;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .chart-bar {
            background: #004996;
            border-radius: 4px 4px 0 0;
            width: 35px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: end;
        }
        
        .chart-value {
            font-size: 11px;
            font-weight: 600;
            color: #004996;
            text-align: center;
            margin-bottom: 5px;
        }
        
        .chart-labels {
            display: flex;
            justify-content: space-between;
        }
        
        .chart-label {
            font-size: 12px;
            color: #6C757D;
            text-align: center;
            width: 35px;
        }
        
        /* Recent Sessions */
        .recent-sessions {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .sessions-title {
            font-size: 18px;
            font-weight: 600;
            color: #004996;
            margin-bottom: 15px;
        }
        
        .session-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .session-item:last-child {
            border-bottom: none;
        }
        
        .session-date {
            font-size: 14px;
            color: #6C757D;
        }
        
        .session-result {
            font-size: 16px;
            font-weight: 600;
            color: #004996;
        }
        
        /* Start Practice Button */
        .start-practice {
            background: #004996;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .start-practice:hover {
            background: #003875;
        }
        
        /* Icons */
        .icon {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="back-arrow">
                <span class="icon">←</span>
            </div>
            <div class="header-title">Juggling Progress</div>
            <div class="placeholder"></div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Hero Stats -->
            <div class="hero-stats">
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-label">TODAY</div>
                        <div class="stat-value">--</div>
                        <div class="stat-change">-- from yesterday</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">WEEK AVG</div>
                        <div class="stat-value">--</div>
                        <div class="stat-change">-- this week</div>
                    </div>
                </div>
            </div>

            <!-- Personal Best -->
            <div class="personal-best">
                <div class="best-icon">🏆</div>
                <div class="best-label">PERSONAL BEST</div>
                <div class="best-value">-- touches</div>
                <div class="best-date">Set on --</div>
            </div>

            <!-- 7 Day Chart -->
            <div class="chart-section">
                <div class="chart-title">Last 7 Days</div>
                <div class="chart-container">
                    <div class="chart-bar" style="height: 0%;">
                        <div class="chart-value">--</div>
                    </div>
                    <div class="chart-bar" style="height: 0%;">
                        <div class="chart-value">--</div>
                    </div>
                    <div class="chart-bar" style="height: 0%;">
                        <div class="chart-value">--</div>
                    </div>
                    <div class="chart-bar" style="height: 0%;">
                        <div class="chart-value">--</div>
                    </div>
                    <div class="chart-bar" style="height: 0%;">
                        <div class="chart-value">--</div>
                    </div>
                    <div class="chart-bar" style="height: 0%;">
                        <div class="chart-value">--</div>
                    </div>
                    <div class="chart-bar" style="height: 0%;">
                        <div class="chart-value">--</div>
                    </div>
                </div>
                <div class="chart-labels">
                    <div class="chart-label">Mon</div>
                    <div class="chart-label">Tue</div>
                    <div class="chart-label">Wed</div>
                    <div class="chart-label">Thu</div>
                    <div class="chart-label">Fri</div>
                    <div class="chart-label">Sat</div>
                    <div class="chart-label">Sun</div>
                </div>
            </div>

            <!-- Recent Sessions -->
            <div class="recent-sessions">
                <div class="sessions-title">Recent Sessions</div>
                <div class="session-item">
                    <div class="session-date">No sessions yet</div>
                    <div class="session-result">-- touches</div>
                </div>
            </div>

            <!-- Start Practice Button -->
            <button class="start-practice">Start Practice</button>
        </div>
    </div>
</body>
</html>
